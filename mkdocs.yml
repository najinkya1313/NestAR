site_name: NestAR
site_description: Bayesian ARIMA model selection for astronomical time-series analysis using Nested Sampling
site_url: !ENV READTHEDOCS_CANONICAL_URL



theme:
  name: readthedocs
  logo: assets/nestar_compact_logo.png 
  favicon: assets/nestar_compact_logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: true
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - User Guide: user-guide.md
  - API Reference:
      - ARIMA model: api/arima.md
      - Nested sampler: api/nested-sampling.md
      - Model comparison: api/model-comparison.md
      - Results and plotting: api/results.md
  - Citation: citation.md
